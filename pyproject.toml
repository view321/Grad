[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grad"
version = "0.1.0"
description = "Grad - a personal research agent for mathematics and machine learning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# The core (ledger, preflight, submitters) runs on the standard library plus a
# file lock. Everything heavier is optional and imported lazily at the point of
# use, so `preflight.py` does not need NiceGUI installed to refuse a submission.
dependencies = [
    "portalocker>=2.8",
]

[project.optional-dependencies]
agent = ["claude-agent-sdk>=0.1.0"]
# ipykernel is spawned by name (`python -m ipykernel_launcher`) rather than
# imported, so nothing else would catch its absence; >=6.29 is the floor for the
# control-channel `interrupt_request` handling `_stop_running_cell` relies on.
notebook = ["jupyter-client>=8.6", "ipykernel>=6.29", "nbformat>=5.10", "nbconvert>=7.16"]
retrieval = ["httpx>=0.27", "sqlite-vec>=0.1.6"]
remote = ["keyring>=25.0", "huggingface-hub>=0.24"]
# NiceGUI 3 is a floor, not a preference: the window system needs `Element.move`
# to reparent a window between panes without rebuilding it, and `shared=True` on
# `add_head_html`/`add_body_html`, which 3.0 requires when global-scope markup
# coexists with a `@ui.page` route. On 2.x the shell raises at page build.
ui = ["nicegui>=3.0", "pywebview>=5.0", "nbformat>=5.10", "nbconvert>=7.16"]
math = ["sympy>=1.13", "mpmath>=1.3"]
# HANDOFF-2 §19: the extension set is *declared*, not accumulated, and every pin
# is exact rather than a floor. The JupyterLab 3->4 break is what killed the
# Tabnine extension, and an unrelated `pip install -U` must not be able to take
# the Lab tab down. "Connect an arbitrary extension" means: add a pin here,
# reinstall, restart. Read any *server* extension before adding it -- it runs in
# the Lab process with your filesystem rights and can reach the credential store.
lab = [
    "jupyterlab==4.4.7",
    "jupyterlab-lsp==5.1.1",
    "python-lsp-server[all]==1.12.2",
    "jupyterlab-git==0.51.1",
]
# §20: human-facing only. Not in the agent's tool list and not in system.md.
wiki = ["repowiki==0.3.1"]
# §21: the evolutionary search driver. Pinned exactly, like the `lab` extra, and
# to a version that actually exists: 0.0.7 is the latest published release, so
# the `>=0.2` this originally carried was unsatisfiable and would have failed at
# install time. Optional because the campaign bookkeeping and the budget gate --
# the parts that matter -- are ours either way.
evolve = ["shinka-evolve==0.0.7"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
grad = "agent:main"

[tool.setuptools]
packages = ["core", "tools", "ui", "ui.windows"]

# The stylesheet is generated from `ui/tokens.py`, but `tiling.js` and any
# vendored fonts are real files and have to travel with the wheel -- without
# them an installed Grad has no pane dragging and no typefaces.
[tool.setuptools.package-data]
ui = ["static/*.js", "static/fonts/*", "assets/katex/**/*"]
# Top-level modules, not packages. Without these the installed `grad` command
# cannot import `agent:main`, and `hooks` would be missing under it.
py-modules = ["agent", "hooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: integration tests that start a real Jupyter kernel",
]
