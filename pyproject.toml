[build-system]
# 77 rather than 68 is the floor for PEP 639 (`license` as an SPDX expression
# plus `license-files`). The older `license = { text = "MIT" }` form is
# deprecated, and it was also the form that let this project claim a licence for
# two months with no LICENSE file in the tree -- metadata that says MIT and a
# repository that grants nothing is worse than saying nothing at all.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grad"
version = "0.1.0"
description = "Grad - a personal research agent for mathematics and machine learning"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

# The core (ledger, preflight, submitters) runs on the standard library plus a
# file lock. Everything heavier is optional and imported lazily at the point of
# use, so `preflight.py` does not need NiceGUI installed to refuse a submission.
dependencies = [
    "portalocker>=2.8",
]

[project.optional-dependencies]
agent = ["claude-agent-sdk>=0.1.0"]
# ipykernel is spawned by name (`python -m ipykernel_launcher`) rather than
# imported, so nothing else would catch its absence; >=6.29 is the floor for the
# control-channel `interrupt_request` handling `_stop_running_cell` relies on.
notebook = ["jupyter-client>=8.6", "ipykernel>=6.29", "nbformat>=5.10", "nbconvert>=7.16"]
retrieval = ["httpx>=0.27", "sqlite-vec>=0.1.6"]
remote = ["keyring>=25.0", "huggingface-hub>=0.24"]
# `tools/kaggle.py` shells out to the `kaggle` CLI rather than importing the
# package, for the reason `gpu.py` shells out to ssh: the credential goes into
# one child process's environment at the moment of use and never into this one's.
# The floor is where `kernels push --accelerator <id>` replaced the older
# enable_gpu/enable_tpu booleans -- on an earlier CLI the flag is silently
# unrecognised and every kernel runs on CPU, which is a job that burns no quota
# and produces nothing.
kaggle = ["keyring>=25.0", "kaggle>=1.6.14"]
# NiceGUI 3 is a floor, not a preference: the window system needs `Element.move`
# to reparent a window between panes without rebuilding it, and `shared=True` on
# `add_head_html`/`add_body_html`, which 3.0 requires when global-scope markup
# coexists with a `@ui.page` route. On 2.x the shell raises at page build.
#
# `pystray` and `pillow` are here because `ui/desktop.py` imports them, which
# sounds too obvious to state and is exactly what went wrong: neither was
# declared anywhere, and both happened to be present on the machine this was
# written on. NiceGUI is why. It *does* depend on Pillow -- but only under its
# own `matplotlib` extra, so `nicegui>=3.0` brings none of it, and a grep for
# "pillow" in the installed metadata finds the conditional line and looks
# satisfied.
#
# What a fresh install actually got: `write_icon` raised at
# `from PIL import Image` (the installer catches it and the shortcut falls back
# to Python's own icon, so it warns rather than fails), and `start_tray`
# returned None -- no notification area, and `hide_to_tray` refuses to hide a
# window it has no way to bring back. The same class of bug as `py-modules`
# sitting under `package-data`: invisible to every developer machine, found by
# the first real installation.
#
# Pillow is named explicitly even though `pystray` depends on it. A module that
# imports PIL should say so itself rather than rely on a sibling's transitive
# dependency, which is a thing that can be dropped in a minor release.
ui = [
    "nicegui>=3.0", "pywebview>=5.0", "nbformat>=5.10", "nbconvert>=7.16",
    "pystray>=0.19", "pillow>=10.0",
    "grad[lab]",
]
math = ["sympy>=1.13", "mpmath>=1.3"]
# HANDOFF-2 §19: the extension set is *declared*, not accumulated, and every pin
# is exact rather than a floor. The JupyterLab 3->4 break is what killed the
# Tabnine extension, and an unrelated `pip install -U` must not be able to take
# the Lab tab down. "Connect an arbitrary extension" means: add a pin here,
# reinstall, restart. Read any *server* extension before adding it -- it runs in
# the Lab process with your filesystem rights and can reach the credential store.
#
# Split in two, because these answer different questions. The notebook window is
# one of the twelve and its interior *is* Lab, so shipping the app without a Lab
# server ships a window whose only content is a button that fails -- `ui` now
# depends on this extra for that reason. The extensions are a preference and stay
# opt-in: `python-lsp-server[all]` alone is heavier than everything else in this
# file put together.
lab = ["jupyterlab==4.4.7"]
lab-extensions = [
    "jupyterlab-lsp==5.1.1",
    "python-lsp-server[all]==1.12.2",
    "jupyterlab-git==0.51.1",
]
# §20: human-facing only. Not in the agent's tool list and not in system.md.
wiki = ["repowiki==0.3.1"]
# §21: the evolutionary search driver. Pinned exactly, like the `lab` extra, and
# to a version that actually exists: 0.0.7 is the latest published release, so
# the `>=0.2` this originally carried was unsatisfiable and would have failed at
# install time. Optional because the campaign bookkeeping and the budget gate --
# the parts that matter -- are ours either way.
evolve = ["shinka-evolve==0.0.7"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
grad = "agent:main"

[tool.setuptools]
packages = ["core", "tools", "ui", "ui.windows"]
# Top-level modules, not packages. Without these the installed `grad` command
# cannot import `agent:main`, and `hooks` would be missing under it.
#
# This key belongs to `[tool.setuptools]` and spent its first months one table
# lower, under `package-data`, where setuptools reads keys as *package names* --
# so it declared package data for a package called `py-modules` and declared no
# top-level modules at all. The editable install hid it completely, because an
# editable install puts the source tree on the path and `import agent` resolves
# whether or not the wheel would have contained it. Only a real wheel would have
# found this, and `grad --update` never builds one.
py-modules = ["agent", "hooks"]

# The stylesheet is generated from `ui/tokens.py`, but `tiling.js` and any
# vendored fonts are real files and have to travel with the wheel -- without
# them an installed Grad has no pane dragging and no typefaces.
[tool.setuptools.package-data]
ui = ["static/*.js", "static/fonts/*", "assets/katex/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: integration tests that start a real Jupyter kernel",
]
